[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investiq"
version = "0.2.0"
description = "Agente educativo financiero con web local y herramientas verificables"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "langchain-nvidia-ai-endpoints>=0.3.15",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "sqlmodel>=0.0.22",
  "truststore>=0.10",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
investiq-data = "investiq.ml.pipeline:main"
investiq-app = "investiq.web.server:main"
investiq-web = "investiq.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investiq = ["prompts/*.md", "knowledge/data/*.json", "web/static/*.html", "web/static/*.css", "web/static/*.js", "web/static/fonts/*.ttf", "web/static/fonts/*-OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: calls a live external service"]
