services:
  - type: web
    name: investiq-poc
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: investiq-app
    healthCheckPath: /api/health
    envVars:
      - key: INVESTIQ_ACCESS_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./investiq.db
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_TIMEOUT_SECONDS
        value: "25"
      - key: NVIDIA_MAX_TOKENS
        value: "700"
      - key: HTTP_TIMEOUT_SECONDS
        value: "8"
      - key: CONVERSATION_MEMORY_DAYS
        value: "90"
      - key: INVESTIQ_SECTOR_ETF_FALLBACK_ENABLED
        value: "true"
      - key: MARKET_TIMEZONE
        value: America/Bogota
      - key: INVESTIQ_SHOW_DIAGNOSTICS
        value: "false"
      - key: INVESTIQ_LOG_LEVEL
        value: INFO
